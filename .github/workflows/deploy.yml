name: Deploy Social Network Agent

on:
  push:
    branches:
      - main
    paths:
      - "social-network-agent.json"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Agentflow to Flowise
        uses: appleboy/ssh-action@v1.0.3

        env:
          FLOWISE_API_KEY: ${{ secrets.FLOWISE_API_KEY }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FLOWISE_API_KEY

          script: |
            set -e

            REPO="/home/ubuntu/Social-network-agent"
            FLOW_ID="ff97cbbd-f246-4c94-9c73-c9bd553f2544"
            URL="http://localhost:3000/api/v1/chatflows/$FLOW_ID"

            echo "Updating repository..."

            cd "$REPO"
            git pull origin main

            echo "Validating JSON..."

            python3 -m json.tool social-network-agent.json > /dev/null

            echo "Creating backup of current Flowise Agentflow..."

            curl -fsS \
              -H "Authorization: Bearer $FLOWISE_API_KEY" \
              "$URL" \
              -o /tmp/social-network-agent-backup.json

            echo "Backup created."

            echo "Preparing deployment payload..."

            python3 - <<'PY'
            import json

            with open("social-network-agent.json", "r", encoding="utf-8") as f:
                exported = json.load(f)

            # Flowise stores the graph itself inside flowData.
            flow_data = {
                "nodes": exported["nodes"],
                "edges": exported["edges"]
            }

            payload = {
                "flowData": json.dumps(flow_data)
            }

            with open("/tmp/social-network-agent-payload.json", "w", encoding="utf-8") as f:
                json.dump(payload, f)

            print("Payload prepared successfully.")
            PY

            echo "Updating existing Flowise Agentflow..."

            HTTP_CODE=$(curl -sS \
              -o /tmp/update-response.json \
              -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer $FLOWISE_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/social-network-agent-payload.json \
              "$URL")

            echo "Flowise returned HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "Deployment failed."
              cat /tmp/update-response.json
              exit 1
            fi

            echo "Deployment successful."
